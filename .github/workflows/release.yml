name: Publish GitHub Release (APK + Windows ZIP)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.3.0)'
        required: true
        default: 'v0.3.0'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Decode permanent signing keystore
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > android-app/app/viberemote-signing.p12
            ls -lh android-app/app/viberemote-signing.p12
          fi

      - name: Build Debug APK
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK for Release
        uses: actions/upload-artifact@v4
        with:
          name: release-android-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.12 and dependencies
        working-directory: pc-server
        run: |
          uv python install 3.12
          uv sync --python 3.12
          uv pip install pyinstaller

      - name: Run unit tests
        working-directory: pc-server
        run: uv run pytest -v

      - name: Bundle Windows Server
        working-directory: pc-server
        run: |
          uv run pyinstaller --noconfirm --onedir --console `
            --name VibeRemoteServer `
            --add-data "vibe_server/web_debug.html;vibe_server" `
            --collect-all sherpa_onnx `
            --collect-all sherpa_onnx_core `
            --collect-all qrcode `
            --collect-all pystray `
            --collect-all PIL `
            --hidden-import pystray._win32 `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import tkinter `
            run_server.py

      - name: Package portable ZIP
        working-directory: pc-server
        run: |
          Copy-Item config.example.toml dist/VibeRemoteServer/
          Copy-Item 放行防火墙.bat dist/VibeRemoteServer/
          Copy-Item 以管理员启动.bat dist/VibeRemoteServer/
          Compress-Archive -Path dist/VibeRemoteServer/* -DestinationPath VibeRemote-Windows-Portable.zip -Force

      - name: Upload Windows ZIP for Release
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-zip
          path: pc-server/VibeRemote-Windows-Portable.zip

  publish-release:
    needs: [ build-android, build-windows ]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: release-android-apk
          path: release-assets

      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: release-windows-zip
          path: release-assets

      - name: Rename APK with version tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mv release-assets/app-debug.apk "release-assets/VibeRemote-${TAG}.apk"
          ls -lh release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: VibeRemote ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/*.zip
