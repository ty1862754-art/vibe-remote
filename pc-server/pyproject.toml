[project]
name = "vibe-remote-server"
version = "0.4.1"
description = "Windows PC server for VibeRemote: low-latency Wi-Fi touchpad, shortcut macros, and local SenseVoice ASR"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sherpa-onnx>=1.12.0",
    "numpy>=2.0.0",
    "qrcode>=8.0",
    "httpx>=0.28.0",
    "pystray>=0.19.5",
    "pillow>=11.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
vibe-server = "vibe_server.main:cli"
vibe-download-model = "vibe_server.asr_engine:cli_download_model"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vibe_server"]
